plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kim.tinyplanes'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kim.tinyplanes'
        minSdk 26          // Android 8.0+; the S24 runs Android 14/15
        targetSdk 35
        versionCode 2
        versionName '0.2-prototype'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
